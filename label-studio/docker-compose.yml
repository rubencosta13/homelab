services:
  nginx:
    image: heartexlabs/label-studio:latest
    container_name: labelstudio-nginx
    hostname: labelstudio-nginx
    command: nginx
    environment:
      - LABEL_STUDIO_HOST=${LABEL_STUDIO_HOST:-https://your-labelstudio-domain.com}
      # - NGINX_ERROR_LOG_LEVEL=warn               # optional, reduces noise
      # - NGINX_SSL_CERT=/certs/cert.pem           # uncomment + mount for HTTPS
      # - NGINX_SSL_CERT_KEY=/certs/cert.key
    ports:
      - "8991:8085"           # ← only this exposed to host / internet
      # - "443:8085"          # ← add later for HTTPS
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.8"
          memory: 768M
        reservations:
          cpus: "0.3"
          memory: 384M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/health"]  # Label Studio nginx has /health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    security_opt:
      - no-new-privileges:true
    volumes:
      - labelstudio-data:/label-studio/data:rw
      # - ./certs:/certs:ro                       # for future HTTPS
    depends_on:
      - app
    networks:
      - nginx_default

  app:
    image: heartexlabs/label-studio:latest
    container_name: labelstudio-app
    hostname: labelstudio-app
    command: label-studio-uwsgi
    environment:
      - DJANGO_DB=default
      - POSTGRE_NAME=labelstudio
      - POSTGRE_USER=labelstudio
      - POSTGRE_PASSWORD=${POSTGRE_PASSWORD}
      - POSTGRE_PORT=5432
      - POSTGRE_HOST=db
      - LABEL_STUDIO_HOST=${LABEL_STUDIO_HOST:-https://your-labelstudio-domain.com}
      - JSON_LOG=1
      - SSRF_PROTECTION_ENABLED=true
      # - LOG_LEVEL=INFO
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.2"
          memory: 2G
        reservations:
          cpus: "0.6"
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - labelstudio-data:/label-studio/data:rw
    depends_on:
      db:
        condition: service_healthy
    networks:
      - nginx_default
      - labelstudio-db-net

  db:
    image: postgres:17-alpine   # or keep pgautoupgrade:17-alpine if you prefer auto-upgrade
    container_name: labelstudio-db
    hostname: labelstudio-db
    environment:
      POSTGRES_USER: labelstudio
      POSTGRES_PASSWORD: ${POSTGRE_PASSWORD}
      POSTGRES_DB: labelstudio
      PGDATA: /var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s
    volumes:
      - labelstudio-postgres-data:/var/lib/postgresql/data
    networks:
      - labelstudio-db-net

networks:
  nginx_default:
    external: true
  labelstudio-db-net:
    name: labelstudio-db-net

volumes:
  labelstudio-data:
  labelstudio-postgres-data:

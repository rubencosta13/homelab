services:
  broker:
    image: docker.io/library/redis:8
    restart: unless-stopped
    volumes:
      - redisdata:/data

  db:
    image: docker.io/library/postgres:18
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql
    env_file:
      docker-compose.env
      

  webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    restart: unless-stopped
    #user: "1000:1000"
    depends_on:
      - db
      - broker
      - gotenberg
      - tika
    ports:
      - "18080:8000"
    volumes:
      # NAS mounts for persistent storage
      - /mnt/nas/#Paperless/data:/usr/src/paperless/data
      - /mnt/nas/#Paperless/media:/usr/src/paperless/media
      - ./export:/usr/src/paperless/export
      - ./consume:/usr/src/paperless/consume
    env_file: docker-compose.env

  gotenberg:
    image: docker.io/gotenberg/gotenberg:8.25
    restart: unless-stopped
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=true"
      - "--chromium-allow-list=file:///tmp/.*"

  tika:
    image: docker.io/apache/tika:latest
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  # Remove the old named volumes for data/media since we're using direct bind mounts to NAS
